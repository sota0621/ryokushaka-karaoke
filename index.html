<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>リョクカラ - 緑黄色社会 カラオケ支援アプリ</title>
  
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #00a86b;       /* リョクシャカグリーン */
      --primary-light: #e6f7f0;
      --secondary: #fcd34d;     /* サンシャインイエロー */
      --secondary-dark: #f59e0b;
      --accent: #ef4444;        /* ポップレッド */
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,168,107,0.08);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 90px;
      line-height: 1.5;
    }

    /* ヘッダー */
    header {
      background: linear-gradient(135deg, var(--primary) 0%, #059669 100%);
      color: white;
      padding: 18px 20px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
    }

    .header-title-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-title {
      font-size: 1.4rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.5px;
    }

    .app-title span.accent-badge {
      background: var(--secondary);
      color: #92400e;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 700;
      vertical-align: middle;
    }

    /* メインコンテンツ & タブ切替 */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ボトムナビゲーション */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 8px 0 12px;
      border-top: 1px solid var(--border-color);
      box-shadow: 0 -4px 16px rgba(0,0,0,0.05);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-decoration: none;
      background: none;
      border: none;
      width: 25%;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-item i {
      font-size: 1.25rem;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: var(--primary);
    }

    /* コンポーネント共通 */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, #059669 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(0, 168, 107, 0.25);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--secondary);
      color: #78350f;
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
      width: auto;
      border-radius: 8px;
    }

    /* 検索バー */
    .search-box {
      position: relative;
      margin-bottom: 14px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      font-size: 0.95rem;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-color);
      outline: none;
      background: white;
      font-family: inherit;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* タグフィルター */
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .tag-chip {
      font-size: 0.75rem;
      padding: 5px 12px;
      border-radius: 20px;
      background: #f1f5f9;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      cursor: pointer;
      font-weight: 700;
    }

    .tag-chip.active {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }

    /* 楽曲リストアイテム */
    .song-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: white;
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      border: 1px solid var(--border-color);
    }

    .song-info {
      flex: 1;
      min-width: 0;
      padding-right: 8px;
    }

    .song-title {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .song-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: #f1f5f9;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn.active-history {
      background: #fef2f2;
      color: var(--accent);
    }

    .icon-btn.active-setlist {
      background: var(--primary-light);
      color: var(--primary);
    }

    /* ランダム決定カード */
    .random-box {
      text-align: center;
      padding: 24px 16px;
      background: linear-gradient(180deg, #ffffff 0%, var(--primary-light) 100%);
      border: 2px solid var(--primary);
    }

    .random-display {
      min-height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 16px 0;
    }

    .random-song-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 4px;
    }

    /* 今日のセトリ用スタイル */
    .setlist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      border: 1px solid var(--border-color);
    }

    .setlist-number {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--primary);
      width: 24px;
      text-align: center;
    }

    /* 空状態表示 */
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 2.5rem;
      margin-bottom: 8px;
      opacity: 0.4;
    }

    /* バッジ */
    .badge {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .badge-confirmed {
      background: #dcfce7;
      color: #15803d;
    }

    .badge-unconfirmed {
      background: #f1f5f9;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <div class="header-title-container">
      <div class="app-title">
        <i class="fa-solid fa-microphone-lines"></i>
        リョクカラ
        <span class="accent-badge">DAM対応</span>
      </div>
      <div id="songCountBadge" style="font-size: 0.75rem; background: rgba(255,255,255,0.2); padding: 3px 8px; border-radius: 12px;">
        全 0 曲
      </div>
    </div>
  </header>

  <div class="container">

    <!-- 1. 楽曲一覧＆検索 タブ -->
    <section id="tab-songs" class="tab-content active">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="曲名・アルバム名・タイアップを入力...">
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted);">タグで絞り込み</span>
        <label style="font-size: 0.75rem; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 4px;">
          <input type="checkbox" id="damFilterCheck"> DAM確認済みのみ
        </label>
      </div>

      <div class="tag-container" id="tagFilters">
        <button class="tag-chip active" data-tag="ALL">すべて</button>
        <button class="tag-chip" data-tag="定番・盛り上がる">定番・盛り上がる</button>
        <button class="tag-chip" data-tag="爽やか">爽やか</button>
        <button class="tag-chip" data-tag="エモい・切ない">エモい・切ない</button>
        <button class="tag-chip" data-tag="かっこいい">かっこいい</button>
        <button class="tag-chip" data-tag="ポップ">ポップ</button>
        <button class="tag-chip" data-tag="バラード・じっくり">バラード・じっくり</button>
        <button class="tag-chip" data-tag="アップテンポ">アップテンポ</button>
        <button class="tag-chip" data-tag="タイアップ曲">タイアップ</button>
      </div>

      <div id="songList"></div>
    </section>

    <!-- 2. ランダム決定 タブ -->
    <section id="tab-random" class="tab-content">
      <div class="card random-box">
        <div style="font-size: 0.85rem; font-weight: 700; color: var(--primary);">迷ったらコレ！</div>
        <h2 style="font-size: 1.2rem; font-weight: 800; margin-bottom: 12px;">本日の運命曲ルーレット</h2>
        
        <div class="random-display" id="randomResult">
          <i class="fa-solid fa-dice" style="font-size: 3rem; color: var(--primary); opacity: 0.3; margin-bottom: 8px;"></i>
          <p style="color: var(--text-muted); font-size: 0.9rem;">「曲をガチャる」を押
